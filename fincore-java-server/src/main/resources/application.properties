spring.application.name=fincore-java-server
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fincore}
spring.datasource.username=${DATABASE_USERNAME:fincore}
spring.datasource.password=${DATABASE_PASSWORD:fincore}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
spring.jpa.properties.hibernate.type.json_format_mapper=com.fincore.server.config.CompanyJsonFormatMapper
