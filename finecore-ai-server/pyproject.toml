[project]
name = "finecore-ai-server"
version = "0.0.1"
description = "FinCore Python service for financial analytics and future filing research."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling>=1.26,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finecore_ai_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
