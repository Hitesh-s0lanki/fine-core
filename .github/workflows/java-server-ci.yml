name: Java server CI

on:
  push:
    paths:
      - 'fincore-java-server/**'
      - '.github/workflows/java-server-ci.yml'
      - '.githooks/**'
      - 'scripts/**'
      - 'tests/**'
      - '.gitattributes'
  pull_request:
    paths:
      - 'fincore-java-server/**'
      - '.github/workflows/java-server-ci.yml'
      - '.githooks/**'
      - 'scripts/**'
      - 'tests/**'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-server-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, style, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fincore-java-server
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fincore-java-server/pom.xml

      - name: Test Git hooks
        working-directory: .
        run: |
          sh -n .githooks/pre-commit .githooks/pre-push scripts/install-git-hooks.sh scripts/run-git-checks.sh
          python3 -m unittest discover -s tests -v

      - name: Check formatting, Checkstyle, and run all tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload check and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-server-reports
          path: |
            fincore-java-server/target/checkstyle-result.xml
            fincore-java-server/target/surefire-reports/
            fincore-java-server/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
