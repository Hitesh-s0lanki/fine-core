name: AI server CI

on:
  push:
    paths:
      - 'finecore-ai-server/**'
      - '.github/workflows/ai-server-ci.yml'
  pull_request:
    paths:
      - 'finecore-ai-server/**'
      - '.github/workflows/ai-server-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-server-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: finecore-ai-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv and locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked
      - name: Check lint and formatting
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Run tests
        run: uv run --frozen pytest
      - name: Build distribution
        run: uv build
